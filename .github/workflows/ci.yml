name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI never uses cloud credentials; live Nebius tests are opt-in only.
      PROOFLAYER_MOCK_MODE: "true"
      RUN_LIVE_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Handoff package check
        run: python scripts/check_docs.py
