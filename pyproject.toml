# Repository-level tool configuration. Backend dependencies live in apps/api.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["prooflayer_agent_pack"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; tests use fake, non-secret key strings.
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]
# Autogenerated Alembic revisions keep long single-line column definitions.
"apps/api/migrations/versions/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["prooflayer_api", "prooflayer_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "packages/contracts"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
